name: Android CI

# Every PR gets a build, the unit tests, lint, and an installable debug APK.
# Pushes to main run the same checks, so main is always known-good.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Installs the SDK command-line tools and accepts licences; AGP downloads
      # the compileSdk platform and build-tools it needs on first use.
      # The action's default package list includes "tools", which Google no longer
      # publishes, so sdkmanager exits 1. platform-tools is all this build needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Caches Gradle and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Fails only on issues not already in app/lint-baseline.xml.
      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: appcleaner-debug-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
